[workspace]
members = ["apps/api", "apps/worker", "apps/migrate", "crates/shared", "crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
axum = "=0.8.4"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.219", features = ["derive"] }
tower = { version = "=0.5.2", features = ["util"] }

uuid = { version = "=1.16.0", features = ["serde"] }
rust_decimal = { version = "=1.37.1", default-features = false, features = ["std"] }
chrono = { version = "=0.4.41", default-features = false, features = ["std"] }
serde_json = "=1.0.143"

sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid"] }
