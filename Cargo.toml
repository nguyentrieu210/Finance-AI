[workspace]
members = ["apps/api", "apps/worker", "crates/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
axum = "=0.8.4"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.219", features = ["derive"] }
tower = { version = "=0.5.2", features = ["util"] }
