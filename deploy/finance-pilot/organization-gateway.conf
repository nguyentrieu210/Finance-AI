# Mount only after the Rust pilot has passed readiness and authorization probes.
location ~ ^/v1/(organizations|memberships)(/|$) {
    auth_request /_nv_session_check;
    auth_request_set $nv_bearer $upstream_http_x_auth_request_access_token;
    auth_request_set $nv_refreshed_cookie $upstream_http_set_cookie;
    # Only accept browser mutations originating from this site.
    if ($nv_org_cross_origin) { return 403; }
    proxy_pass http://127.0.0.1:18194;
    proxy_http_version 1.1;
    proxy_set_header Host namviet.gpcds.site;
    proxy_set_header Authorization "Bearer $nv_bearer";
    proxy_set_header Cookie "";
    proxy_set_header X-Auth-Request-Access-Token "";
    proxy_set_header X-Forwarded-Access-Token "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Authorization;
    proxy_hide_header X-Auth-Request-Access-Token;
    proxy_hide_header X-Forwarded-Access-Token;
    add_header Set-Cookie $nv_refreshed_cookie always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    access_log off;
}
