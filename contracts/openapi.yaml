  /v1/dossiers:
    get:
      operationId: listDossiers
      tags:
      - E18
      summary: listDossiers
      x-release-gate: pilot
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: company_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter within verified actor scope; never grants additional access.
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - PAYMENT
          - ADVANCE
          - SETTLEMENT
        description: Filter within verified actor scope; never grants additional access.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - PROCESSING
          - NEEDS_INPUT
          - REVIEWABLE
          - READY
          - EXPORTED
          - HANDED_OFF
          - ACCOUNTING_REVIEW
          - ACCEPTED
          - RETURNED
          - CANCELLED
        description: Filter within verified actor scope; never grants additional access.
      - name: updated_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: updated_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dossier'
                  next_cursor:
                    type: string
                required:
                - items
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or out of scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Business guard failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createDossier
      tags:
      - E18
      summary: createDossier
      x-release-gate: pilot
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        description: Scoped by verified tenant/company, actor and registered operation. Reuse with a different target/version/payload
          returns 409.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dossier'
          headers:
            Finance-Version:
              required: true
              description: Current dossier aggregate token after successful operation; clients send it as If-Finance-Version.
                On idempotent replay returns original receipt token.
              schema:
                type: string
                pattern: ^"v1:(dossier|organization|membership|policy|rule|form|template|workflow|reference|risk|reconciliation):[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:(0|[1-9][0-9]{0,15})"$
                description: Canonical quoted aggregate token; numeric version 0..9007199254740991. Server validates target
                  kind, ID and current version after authorization.
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or out of scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Business guard failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                company_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                  - PAYMENT
                  - ADVANCE
                  - SETTLEMENT
              required:
              - company_id
              - kind
      description: Reauthorize before replay; idempotency receipt is immutable and scoped.
