components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        field_path:
          type: string
      required:
      - code
      - message
      - correlation_id
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: &id009
          type: string
          pattern: ^-?\d+(\.\d{1,8})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
    Evidence:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        page:
          type: integer
          minimum: 1
        locator:
          type: string
        excerpt:
          type: string
      required:
      - id
      - document_id
      - sha256
      - locator
    Dossier:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        code:
          type: string
        kind:
          type: string
          enum:
          - PAYMENT
          - ADVANCE
          - SETTLEMENT
        status:
          type: string
          enum:
          - DRAFT
          - PROCESSING
          - NEEDS_INPUT
          - REVIEWABLE
          - READY
          - EXPORTED
          - HANDED_OFF
          - ACCOUNTING_REVIEW
          - ACCEPTED
          - RETURNED
          - CANCELLED
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        owner_id:
          type: string
          format: uuid
        updated_at: *id004
      required:
      - id
      - company_id
      - code
      - kind
      - status
      - revision
      - version
      - owner_id
      - updated_at
    Document:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        dossier_id:
          type: string
          format: uuid
