name: Foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Spec validation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/spec-requirements.txt
          .venv/bin/python scripts/validate_spec.py
          .venv/bin/openapi-spec-validator contracts/openapi.yaml
          .venv/bin/python scripts/validate_http_contract.py
          .venv/bin/python scripts/validate_table_registry.py
      - name: Rust toolchain
        run: rustup show
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm ci --include=dev
          npm run check:api
          npm run typecheck
          npm test
          npm run build
      - name: Compose validation
        env:
          FINANCE_DEV_DB_PASSWORD: ci-config-only-not-a-secret
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Real database baseline
        run: bash scripts/test_migration_baseline.sh
