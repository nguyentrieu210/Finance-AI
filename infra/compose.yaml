name: finance-ai-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_dev
      POSTGRES_PASSWORD: ${FINANCE_DEV_DB_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_dev -d finance"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
